name: Diagnoos
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -4 -s -o /dev/null -w "edupage IPv4: %{http_code} %{time_total}s\n" -m 20 https://haabneeme.edupage.org/ || echo "edupage IPv4 FAIL"
          curl -4 -s -o /dev/null -w "edupage.org IPv4: %{http_code} %{time_total}s\n" -m 20 https://www.edupage.org/ || echo "edupage.org FAIL"
          curl -4 -s -o /dev/null -w "github: %{http_code}\n" -m 20 https://github.com/ || echo "github FAIL"
          curl -s -m 10 https://ipinfo.io/org; echo
