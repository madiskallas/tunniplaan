<!doctype html>
<html lang="et">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>4B tunniplaan</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #eef3f8; color: #1d2733; }
  main { max-width: 560px; margin: 0 auto; padding: 16px; }
  .teade { background: #ffe066; border-radius: 14px; padding: 14px; font-size: 1.25rem; font-weight: 700; text-align: center; margin-bottom: 12px; }
  h1 { font-size: 2.6rem; margin: 8px 0 0; text-align: center; }
  .kuupaev { font-size: 1.4rem; text-align: center; color: #4a5a6a; margin-bottom: 16px; }
  .kaart { background: #fff; border-radius: 16px; padding: 14px 16px; margin-bottom: 10px; box-shadow: 0 2px 6px #0001; }
  .aeg { font-size: 1.15rem; font-weight: 700; }
  .aine { font-size: 1.5rem; font-weight: 800; margin: 4px 0; }
  .info { font-size: 1.1rem; }
  .grupid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; margin-top: 6px; }
  .grupp { min-width: 0; hyphens: manual; overflow-wrap: break-word; background: #f3f6fa; box-shadow: 0 1px 4px #0002; border-radius: 12px; padding: 10px; }
  .grupp .silt { font-weight: 700; font-size: 1rem; color: #7a4fb0; }
  .grupp .aine { font-size: 1.2rem; }
  .vahetund { text-align: center; font-size: 1.1rem; color: #4a5a6a; padding: 8px; margin-bottom: 10px; border: 2px dashed #b8c4d0; border-radius: 14px; }
  .sook { background: #ffd8a8; border: none; color: #7a3e00; font-size: 1.35rem; font-weight: 800; padding: 14px; }
  a { color: #1f6fb2; }
  main { position: relative; z-index: 1; }
  .kaart.praegu { outline: 5px solid #ff3b7f; box-shadow: 0 0 0 9px #ff3b7f33, 0 6px 16px #0003; transform: scale(1.03); }
  .kaart.jargmisena::before { content: "👉 JÄRGMISENA" !important; }
  .kaart.praegu::before { content: "👉 PRAEGU"; display: inline-block; background: #ff3b7f; color: #fff; font-weight: 800; border-radius: 8px; padding: 2px 10px; margin-bottom: 6px; }
  /* Praegu käiv tund helendab ja selle peal vilguvad tähed */
  .kaart.praegu:not(.jargmisena) { position: relative; animation: helenda 1.6s ease-in-out infinite; }
  .taht { position: absolute; width: 18px; height: 18px; margin: -9px; pointer-events: none; z-index: 2;
          background: radial-gradient(circle, #fff 0 18%, #fff8d6 30%, transparent 70%);
          clip-path: polygon(50% 0, 58% 42%, 100% 50%, 58% 58%, 50% 100%, 42% 58%, 0 50%, 42% 42%);
          filter: drop-shadow(0 0 4px #fff) drop-shadow(0 0 8px #ffe066);
          animation: sadele 1.4s ease-in-out infinite; transform: scale(0); }
  @keyframes helenda {
    0%, 100% { box-shadow: 0 0 0 6px #ff3b7f33, 0 0 12px 2px #ffd43b88; transform: scale(1.02); }
    50% { box-shadow: 0 0 0 12px #ff3b7f55, 0 0 34px 12px #ffd43bcc; transform: scale(1.05); }
  }
  @keyframes sadele { 0%, 100% { transform: scale(0) rotate(0); opacity: 0; } 50% { transform: scale(1.3) rotate(90deg); opacity: 1; } }
  .nali { background: #fff; border: 3px solid #ffd43b; border-radius: 16px; padding: 14px; font-size: 1.2rem; margin-bottom: 12px; }
  .nali b { display: block; margin-bottom: 4px; }
  .loendur { background: #1d2733; color: #fff; border-radius: 18px; padding: 16px; text-align: center; margin-bottom: 12px; }
  .loendur b { display: block; font-size: 4rem; line-height: 1.1; }
  .loendur span { font-size: 1.3rem; }
  .kodune { background: #ff8fab; color: #fff; font-size: 1.5rem; }
  /* Lendavad metsaloomad taustal */
  #loomad { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
  .loom { position: absolute; left: -15vw; font-size: 3rem; opacity: .55; animation: lenda linear infinite; }
  .loom i { display: inline-block; font-style: normal; animation: vingu 1.2s ease-in-out infinite alternate; }
  @keyframes lenda { from { transform: translateX(0) } to { transform: translateX(130vw) } }
  @keyframes vingu { from { transform: rotate(-25deg) translateY(-12px) } to { transform: rotate(25deg) translateY(12px) } }
</style>
</head>
<body>
<div id="loomad"></div>
<main id="app">Laen tunniplaani…</main>
<script src="andmed.js"></script>
<script src="laadija.js"></script>
<script src="seaded.js"></script>
<script>
// Kell Eesti ajas (või ?aeg=2026-10-09T17:00 testimiseks)
function praegu() {
  const aeg = new URLSearchParams(location.search).get("aeg");
  if (aeg && /^\d{4}-\d\d-\d\dT\d\d:\d\d/.test(aeg)) return { kuupaev: aeg.slice(0, 10), min: minutid(aeg.slice(11, 16)) };
  const o = {};
  new Intl.DateTimeFormat("en-CA", { timeZone: "Europe/Tallinn", year: "numeric", month: "2-digit", day: "2-digit",
    hour: "2-digit", minute: "2-digit", hourCycle: "h23" }).formatToParts(new Date()).forEach(p => o[p.type] = p.value);
  return { kuupaev: `${o.year}-${o.month}-${o.day}`, min: minutid(`${o.hour}:${o.minute}`) };
}
const minutid = t => +t.slice(0, 2) * 60 + +t.slice(3, 5);
const kell = t => t.replace(/^0/, "");
// Aine valikud seaded.js-ist (nt "Mudilaskoor (ringitund)" → "Mudilaskoor")
const seade = aine => { const S = window.SEADED || {}; return S[aine] || S[Object.keys(S).find(k => aine && aine.startsWith(k))] || null; };
// Poolituskohad eesti õigekirja järgi (sõnaosade piirilt), "|" → peidetud sidekriips
const POOLITUS = ["Tehno|loogia|õpetus", "Käsi|töö", "Keha|line", "kasva|tus", "Loodus|õpetus", "Inimese|õpetus",
  "Kunsti|õpetus", "Klassi|juhataja|tund", "Mudilas|koor", "Jalg|ratta|koolitus", "Tantsu|line", "liiku|mine", "ringi|tund"];
const poolita = tekst => POOLITUS.reduce((t, sona) => t.replace(sona.replaceAll("|", ""), sona.replaceAll("|", "&shy;")), tekst);
const nimi = aine => { const s = seade(aine); return (s ? s.emoji + " " : "") + poolita(esc(aine)); };
const taust = aine => { const s = seade(aine); return s ? ` style="background:${s.varv}"` : ""; };
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function valiPaev(andmed, nyyd) {
  const paevad = andmed.paevad.filter(p => p.tunnid.length);
  const tana = paevad.find(p => p.kuupaev === nyyd.kuupaev);
  if (tana) {
    const lopp = Math.max(...tana.tunnid.map(t => minutid(t.lopp)));
    if (nyyd.min <= lopp + 60) return { paev: tana, jargmine: false };
  }
  const jarg = paevad.filter(p => p.kuupaev > nyyd.kuupaev).sort((a, b) => a.kuupaev.localeCompare(b.kuupaev))[0];
  return jarg ? { paev: jarg, jargmine: true, tanaOliKool: !!tana } : null;
}

function tunniKaart(tunnid, praegu) {
  const t = tunnid[0];
  const aeg = `<div class="aeg">${kell(t.algus)}–${kell(t.lopp)}</div>`;
  if (tunnid.length > 1 || t.grupp) {
    return `<div class="kaart${praegu ? " " + praegu : ""}">${aeg}<div class="grupid">${tunnid.map(g => `
      <div class="grupp"${taust(g.aine)}><div class="silt">${esc(g.grupp || "")}</div>
        <div class="aine">${nimi(g.aine)}</div>
        <div class="info">👩‍🏫 ${esc(g.opetajad.join(", "))}</div>
        <div class="info">🚪 ${esc(g.ruum)}</div></div>`).join("")}</div></div>`;
  }
  return `<div class="kaart${praegu ? " " + praegu : ""}"${taust(t.aine)}>${aeg}<div class="aine">${nimi(t.aine)}</div>
    <div class="info">👩‍🏫 ${esc(t.opetajad.join(", "))}</div>
    <div class="info">🚪 Klass: ${esc(t.ruum)}</div></div>`;
}

// 60 anekdooti – iga päev uus
const NALJAD = [
"Õpetaja: „Juku, miks su kodune töö on kassi käekirjaga?“ Juku: „Sest kass tegi selle!“",
"Miks matemaatikaõpik kurb on? Sest tal on nii palju probleeme.",
"Ema: „Miks sa kartulile laulad?“ Mari: „Õpetaja ütles, et kartulil on silmad. Äkki on tal ka kõrvad!“",
"Õpetaja: „Nimeta viis Aafrika looma.“ Kalle: „Neli elevanti ja üks lõvi!“",
"Miks orav matemaatikat armastab? Sest ta oskab nii hästi pähkleid kokku lugeda!",
"Miks kala kooli ei lähe? Sest tal on juba oma parv!",
"Juku: „Isa, kas sa oskad pimedas kirjutada?“ Isa: „Oskan.“ Juku: „Siis kustuta tuli ja kirjuta mu päevikule alla!“",
"Õpetaja: „Mari, näita kaardil, kus on Ameerika.“ Mari näitab. „Tubli! Ja kes avastas Ameerika?“ Klass: „Mari!“",
"Miks lumememm porgandit ei söö? Sest see on tema nina!",
"Kaks lehma on karjamaal. Üks ütleb: „Muuu!“ Teine: „Võtsid mul sõna suust!“",
"Õpetaja: „Kalle, mis on 2 pluss 2?“ Kalle: „4.“ Õpetaja: „Hea!“ Kalle: „Hea? See on ju täiesti õige!“",
"Isa: „Miks sa magad matemaatikaõpik padja all?“ Poeg: „Et numbrid öösel pähe imbuks!“",
"Kuidas panna elevant külmkappi? Avad ukse, paned elevandi sisse ja paned ukse kinni!",
"Kuidas panna kaelkirjak külmkappi? Avad ukse, võtad elevandi välja ja paned kaelkirjaku sisse!",
"Loomad korraldavad pidu. Kõik on kohal, ainult üks puudub. Kes? Kaelkirjak – ta on ju külmkapis!",
"Õpetaja: „Miks sa hiljaks jäid?“ Juku: „Tee ääres oli silt: „Kool – sõida aeglaselt!““",
"Miks pliiats kurb oli? Sest ta oli nüri ja keegi ei teritanud teda.",
"Ema: „Kes sõi kõik kommid ära?“ Poeg: „Mitte mina! Minu kõht!“",
"Mis on mustvalge ja punane? Pingviin, kes häbeneb.",
"Õpetaja: „Mis juhtub, kui jää sulab?“ Mari: „Siis tuleb kevad!“",
"Miks öökull koolis hästi õpib? Sest ta on alati huu-huu-huvitatud!",
"Mis on rebase lemmikmäng? Peitus – ta on ju nii kaval!",
"Miks tomat punastas? Sest ta nägi salatit riideid vahetamas!",
"Õpetaja: „Juku, kirjuta tahvlile sõna „kass“.“ Juku joonistab tahvlile kassi: „Nii on kiirem!“",
"Õpetaja: „Kes oskab öelda, mis on tolm?“ Juku: „Pori, mis on ära kuivanud!“",
"Mis on roheline ja hüppab? Konn, kes ootab, et teda prints suudleks.",
"Miks karu talvel magab? Sest keegi ei julge teda äratada!",
"Miks pall nuttis? Sest teda löödi kogu aeg jalaga.",
"Mis on kõige naljakam loom? Hüään – ta naerab kogu aeg.",
"Miks orav kooli tuli? Ta tahtis saada pähklikamaks!",
"Mis on kõige parem klass? 4B muidugi!",
"Õpetaja: „Kalle, miks su kirjand koerast on täpselt sama, mis su vennal?“ Kalle: „Sest meil on sama koer!“",
"Miks hobune telefoni ei võta? Sest ta ütleb alati ainult „hirrr“!",
"Juku: „Ema, kas sa oled mulle pahane asja eest, mida ma ei teinud?“ Ema: „Muidugi mitte.“ Juku: „Hea, ma ei teinud koduseid ülesandeid.“",
"Miks raamatukogu nii kõrge maja on? Sest seal on nii palju lugusid!",
"Õpetaja: „Mis on vee keemiline valem?“ Juku: „H, I, J, K, L, M, N, O.“ „Miks nii?“ „Te ise ütlesite: H kuni O!“",
"Mis on valge ja ei tee häält? Vaikne lumi.",
"Karupoeg küsib emalt: „Kas ma olen päris karu?“ Ema: „Muidugi!“ „Kas isa ka?“ „Jah!“ „Miks mul siis nii külm on?“ „Sest sa oled jääkaru!“",
"Isa: „Mis sa koolis täna õppisid?“ Poeg: „Ilmselt mitte piisavalt, sest homme pean jälle minema.“",
"Mis teeb igal hommikul „rrrr“, aga pole koer? Äratuskell!",
"Õpetaja: „Juku, kui sul on 10 kommi ja sa annad Marile 5, mis siis juhtub?“ Juku: „Mari on õnnelik ja mina kurb.“",
"Siil läheb juuksurisse. Juuksur vaatab ja ütleb: „Teile sobiks pigem kammiga ise.“",
"Miks lehm kellukest kannab? Sest tema sarved ei tööta!",
"Õpetaja: „Mari, too näide pikast lausest.“ Mari: „Vanglas.“",
"Kaks hiirt istuvad kinos. Üks küsib: „Kas see film on raamatust parem?“ Teine: „Ei tea, ma sõin raamatu ära.“",
"Mis on suur, hall ja käib trepist üles? Elevant, kes ei leidnud lifti.",
"Miks karu jalgrattaga sõita ei oska? Sest tal on alati kaks paremat käppa!",
"Ema: „Miks su sokid erinevat värvi on?“ Poeg: „Mul on kodus veel teine täpselt samasugune paar!“",
"Mis lendab ja on kõige targem? Õpik – vähemalt minu tunniplaanis!",
"Juku: „Õpetaja, kas inimest võib karistada asja eest, mida ta pole teinud?“ Õpetaja: „Ei.“ Juku: „Super, ma pole kodust tööd teinud!“",
"Miks kass arvuti juurde istus? Et hiirt valvata!",
"Õpetaja: „Kalle, kus on su kodune töö?“ Kalle: „Mu koer sõi selle ära.“ „Sul pole ju koera!“ „See oli laenatud koer.“",
"Kuidas saab teada, et elevant on olnud külmkapis? Võis on täis jalajälgi!",
"Mis on orava lemmiktund? Pähkli-tund ehk loodusõpetus!",
"Miks pingviinid lennata ei viitsi? Sest jalutada on palju lahedam!",
"Mari: „Ema, ma tahan koera!“ Ema: „Sa saad kala.“ Mari: „Kas ma saan siis kalaga jalutamas käia?“",
"Õpetaja: „Juku, nimeta üks pikk jõgi.“ Juku: „Emajõgi – sest ema räägib alati pikalt!“",
"Mis jookseb, aga ei väsi kunagi? Vesi kraanist!",
"Karu läheb poodi ja küsib: „Kas teil mett on?“ Müüja: „Ei ole.“ Järgmisel päeval küsib karu jälle. Kolmandal päeval on uksel silt: „Karu, mett ei ole!“",
"Õpetaja: „Miks sa aknast välja vaatad?“ Juku: „Te ise ütlesite, et vaadake tulevikku!“"
];
const paevaNali = kuupaev => NALJAD[Math.floor(Date.parse(kuupaev + "T00:00Z") / 864e5) % NALJAD.length];

async function alusta() {
  const app = document.getElementById("app");
  const andmed = await laeTunniplaan();
  const nyyd = praegu();
  const valik = valiPaev(andmed, nyyd);
  if (!valik) {
    app.innerHTML = `<div class="teade">😕 Mul pole praegu õiget tunniplaani.</div>
      <p style="font-size:1.2rem;text-align:center">Vaata kooli tunniplaani: <a href="${esc(andmed.allikas)}">${esc(andmed.allikas)}</a></p>`;
    return;
  }
  const { paev, jargmine, tanaOliKool } = valik;
  // Rühmita samal ajal algavad tunnid (grupid) kokku
  const pesad = [];
  [...paev.tunnid].sort((a, b) => a.algus.localeCompare(b.algus)).forEach(t => {
    const p = pesad.find(x => x[0].algus === t.algus);
    p ? p.push(t) : pesad.push([t]);
  });
  const sook = andmed.soogivahetund;
  let html = "";
  if (jargmine) {
    const homme = new Date(nyyd.kuupaev + "T12:00Z"); homme.setUTCDate(homme.getUTCDate() + 1);
    const sona = paev.kuupaev === homme.toISOString().slice(0, 10) ? "homseid" : "järgmise koolipäeva";
    html += `<div class="teade kodune">📚 Õpi kodused ülesanded ära! Või laku panni! 🍳</div>`;
    html += `<div class="teade">${tanaOliKool ? "🎉 Tänased tunnid on läbi!" : "😎 Täna kooli pole!"} Näitan ${sona} tunde.</div>`;
  }
  // Praegune tund = esimene, mis pole veel läbi (vahetunni ajal järgmine tund)
  const lopp = pesa => Math.max(...pesa.map(t => minutid(t.lopp)));
  const praeguI = jargmine ? -1 : pesad.findIndex(pesa => lopp(pesa) > nyyd.min);
  if (praeguI >= 0) {
    const pesa = pesad[praeguI], algus = minutid(pesa[0].algus);
    html += nyyd.min >= algus
      ? `<div class="loendur"><span>⏰ Tunni lõpuni</span><b>${lopp(pesa) - nyyd.min} min</b></div>`
      : `<div class="loendur"><span>⏳ Järgmise tunni alguseni</span><b>${algus - nyyd.min} min</b></div>`;
  }
  // Kooliväline aeg: koolipäev läbi või esimene tund pole veel alanud
  if (jargmine || nyyd.min < minutid(pesad[0][0].algus))
    html += `<div class="nali"><b>😂 Päeva anekdoot</b>${esc(paevaNali(nyyd.kuupaev))}</div>`;
  const [a, k, p] = paev.kuupaev.split("-");
  html += `<h1>${esc(paev.nimi)}</h1><div class="kuupaev">${+p}.${+k}.${a}</div>`;
  pesad.forEach((pesa, i) => {
    if (i > 0) {
      const eelmLopp = Math.max(...pesad[i - 1].map(t => minutid(t.lopp)));
      const algus = minutid(pesa[0].algus);
      if (algus - eelmLopp > 0) {
        const algT = pesad[i - 1].find(t => minutid(t.lopp) === eelmLopp).lopp;
        const onSook = sook && minutid(sook.algus) < algus && minutid(sook.lopp) > eelmLopp;
        html += onSook
          ? `<div class="vahetund sook"${taust("Söögivahetund")}>${seade("Söögivahetund")?.emoji || "🍽️"} Söögivahetund ${kell(algT)}–${kell(pesa[0].algus)}</div>`
          : `<div class="vahetund"${taust("Vahetund")}>${seade("Vahetund")?.emoji || "⏸️"} Vahetund ${kell(algT)}–${kell(pesa[0].algus)}</div>`;
      }
    }
    html += tunniKaart(pesa, i === praeguI && (nyyd.min >= minutid(pesa[0].algus) ? "praegu" : "praegu jargmisena"));
  });
  app.innerHTML = html;
  // Sädelevad tähed juhuslikes kohtades praeguse tunni peal
  const kaart = document.querySelector(".kaart.praegu:not(.jargmisena)");
  if (kaart) for (let n = 0; n < 7; n++) {
    const t = document.createElement("span");
    t.className = "taht";
    const kuhu = () => { t.style.left = Math.random() * 100 + "%"; t.style.top = Math.random() * 100 + "%";
      t.style.width = t.style.height = (10 + Math.random() * 16) + "px"; };
    kuhu();
    t.style.animationDelay = -(Math.random() * 1.4) + "s";
    t.style.animationDuration = (1 + Math.random() * 0.8) + "s";
    t.addEventListener("animationiteration", kuhu);
    kaart.appendChild(t);
  }
  if (!window.keritud) { window.keritud = true; document.querySelector(".praegu")?.scrollIntoView({ block: "center" }); }
}

// Naljakates poosides metsaloomad (orav ja karu on kindlasti olemas!)
const loomad = document.getElementById("loomad");
["🐿️", "🐻", "📚", "🐎", "🦊", "📕", "🦔", "🐴", "🦉", "📗", "🐰", "🐎", "🦌", "📘", "🐿️", "🐻"].forEach((loom, i) => {
  const d = document.createElement("div");
  d.className = "loom";
  d.style.top = (3 + i * 6) + "%";
  d.style.animationDuration = (14 + (i * 7) % 12) + "s";
  d.style.animationDelay = (-i * 3.3) + "s";
  const poos = ["scaleX(-1)", "rotate(180deg)", "rotate(90deg)", "scaleY(-1)", "rotate(-60deg)"][i % 5];
  d.innerHTML = `<i style="animation-delay:${-i * .4}s"><span style="display:inline-block;transform:${poos}">${loom}</span></i>`;
  loomad.appendChild(d);
});

alusta();
setInterval(alusta, 60000); // uuenda iga minut
</script>
</body>
</html>
